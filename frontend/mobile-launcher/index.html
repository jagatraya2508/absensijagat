<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Absensi Launcher</title>
    <!-- Use Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ef4444; /* Clean Red */
            --primary-dark: #dc2626;
            --bg: #f8fafc;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: #1e293b;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-image: radial-gradient(circle at top right, #fecaca 0%, transparent 40%),
                              radial-gradient(circle at bottom left, #fee2e2 0%, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            text-align: center;
            display: none; /* Hidden until URL check finishes */
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-wrapper {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem auto;
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.15);
            font-size: 2.5rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #0f172a;
        }

        p {
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .input-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 0.5rem;
        }

        input {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
            background: white;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }

        input::placeholder {
            color: #94a3b8;
        }

        .btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.9rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.25);
        }

        .btn:active {
            background: var(--primary-dark);
            transform: translateY(1px);
        }

        .error {
            color: var(--primary);
            font-size: 0.8rem;
            margin-top: 0.5rem;
            display: none;
            font-weight: 500;
        }

        /* Loading State */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(239, 68, 68, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Initial Loading Screen -->
    <div id="loading" class="loading">
        <div class="spinner"></div>
    </div>

    <!-- UI Form -->
    <div id="main-ui" class="container">
        <div class="icon-wrapper">
            🌐
        </div>
        <h1>Setup Server</h1>
        <p>Masukkan URL server perusahaan Anda untuk terhubung dengan sistem absensi.</p>
        
        <form id="url-form">
            <div class="input-group">
                <label for="serverUrl">ALAMAT SERVER</label>
                <input 
                    type="text" 
                    id="serverUrl" 
                    placeholder="https://contoh.com atau 192.168.x.x:5173" 
                    required 
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="none"
                >
                <div id="error-msg" class="error">Masukkan URL yang valid (dimulai dengan https:// atau http://)</div>
            </div>
            
            <button type="submit" class="btn">Lanjutkan</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loadingEl = document.getElementById('loading');
            const mainUI = document.getElementById('main-ui');
            const form = document.getElementById('url-form');
            const input = document.getElementById('serverUrl');
            const errorMsg = document.getElementById('error-msg');

            // Handle reset query param
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('reset') === 'true') {
                localStorage.removeItem('company_server_url');
                // Remove param from URL
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            // 1. Check if URL is already saved
            const savedUrl = localStorage.getItem('company_server_url');
            
            if (savedUrl) {
                // Instantly redirect if found
                window.location.replace(savedUrl);
            } else {
                // Show form if no URL is saved
                loadingEl.style.display = 'none';
                mainUI.style.display = 'block';
                input.focus();
            }

            // 2. Handle Form Submit
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                let url = input.value.trim();

                // Validation
                if (!url) return;

                // Auto prepend protocol if missing
                if (!url.startsWith('http://') && !url.startsWith('https://')) {
                    const isLocal = url.includes('localhost') || /^(\d{1,3}\.){3}\d{1,3}/.test(url);
                    url = (isLocal ? 'http://' : 'https://') + url;
                }

                try {
                    // Test if valid URL
                    new URL(url);
                    
                    // Valid! Save and redirect
                    errorMsg.style.display = 'none';
                    localStorage.setItem('company_server_url', url);
                    
                    // Show loading while replacing
                    mainUI.style.display = 'none';
                    loadingEl.style.display = 'flex';
                    
                    window.location.replace(url);
                    
                } catch (err) {
                    // Invalid URL
                    errorMsg.innerText = 'Masukkan URL atau IP Address yang valid';
                    errorMsg.style.display = 'block';
                    input.style.borderColor = 'var(--primary)';
                }
            });

            // Reset styling on input
            input.addEventListener('input', () => {
                errorMsg.style.display = 'none';
                input.style.borderColor = '#cbd5e1';
            });
        });
    </script>
</body>
</html>
