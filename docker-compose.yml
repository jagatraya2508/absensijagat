version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: absensi-postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # Memakai DB_PORT dari .env (contoh 5433) untuk mencegah bentrok dengan postgres lokal
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: node:18-alpine
    container_name: absensi-backend
    restart: always
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/node_modules # Lindungi node_modules agar tidak tertimpa
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    ports:
      - "${PORT:-5000}:5000"
    command: sh -c "npm install && npm run dev"
    depends_on:
      - db

  frontend:
    image: node:18-alpine
    container_name: absensi-frontend
    restart: always
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules # Lindungi node_modules agar tidak tertimpa
    env_file:
      - .env
    environment:
      # Agar Vite proxy bisa diarahkan ke container backend
      - VITE_API_PROXY_TARGET=http://backend:${PORT:-5000}
    ports:
      - "${FRONTEND_PORT:-80}:3000"
    command: sh -c "npm install && npm run build && npx serve -s dist -l 3000"
    depends_on:
      - backend

volumes:
  postgres_data:
