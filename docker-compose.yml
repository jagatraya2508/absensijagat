version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: absensi-postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # Memakai DB_PORT dari .env (contoh 5433) untuk mencegah bentrok dengan postgres lokal
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER:-postgres} -d $${DB_NAME:-absensi}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: node:18-alpine
    container_name: absensi-backend
    restart: always
    working_dir: /app
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - PORT=5000
    ports:
      - "${PORT:-5001}:5000"
    command: sh -c "node server.js"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: absensi-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

volumes:
  postgres_data:
